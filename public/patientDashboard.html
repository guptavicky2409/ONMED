<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Dashboard | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #e9eff5;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }

    .dashboard-card {
      max-width: 1000px;
      margin: auto;
      padding: 25px 35px;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0px 8px 18px rgba(0,0,0,0.1);
      animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
      font-weight: 700;
      color: #0d6efd;
      margin-bottom: 25px;
    }

    table {
      border-radius: 12px;
      overflow: hidden;
    }

    thead {
      background: #0d6efd;
      color: white;
    }

    .badge-status {
      font-size: 13px;
      padding: 6px 10px;
      border-radius: 8px;
    }

    .status-completed { background: #28a745; }
    .status-pending   { background: #ffc107; color: black; }
    .status-cancelled { background: #dc3545; }

    tr:hover {
      background: #f8f9ff;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="dashboard-card">

  <h2><i class="bi bi-calendar2-heart-fill"></i> Your Appointments</h2>

  <table class="table table-hover table-bordered shadow-sm">
    <thead>
      <tr>
        <th>Appointment ID</th>
        <th>Doctor</th>
        <th>Date</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="apptTable"></tbody>
  </table>

</div>


<script>
const patientId = localStorage.getItem("patientId");

if (!patientId) {
  document.body.innerHTML = `
    <div class="alert alert-danger text-center">
      <i class="bi bi-exclamation-octagon"></i> No patient session found. Please login again.
    </div>`;
}

// Fetch Appointments
fetch(`/patients/get-appointments/${patientId}`)
  .then(res => res.json())
  .then(appointments => {
    const table = document.getElementById("apptTable");

    if (!appointments.length) {
      table.innerHTML = `
        <tr><td colspan="5" class="text-center text-muted py-3">No Appointments Found</td></tr>`;
      return;
    }

    appointments.forEach(app => {
      
      // Status Badge
      let badgeClass = "status-pending";
      if (app.status === "Completed") badgeClass = "status-completed";
      if (app.status === "Cancelled") badgeClass = "status-cancelled";

      const problemLink = app.problemDescription
        ? `<a href="/view-problem.html?appointmentId=${app._id}" class="text-primary">View Problem</a>`
        : `<a href="/patientProblems.html?appointmentId=${app._id}" class="text-warning">Explain Problem</a>`;

      const prescriptionLink = app.prescription
        ? ` | <a href="/patientViewPrescription.html?appointmentId=${app._id}" class="text-success">View Prescription</a>`
        : "";

      table.innerHTML += `
        <tr>
          <td>${app._id}</td>
          <td>${app.doctorName}</td>
          <td>${app.date}</td>
          <td>
            <span class="badge badge-status ${badgeClass}">${app.status}</span>
          </td>
          <td>${problemLink} ${prescriptionLink}</td>
        </tr>
      `;
    });
  })
  .catch(() => {
    document.getElementById("apptTable").innerHTML =
      `<tr><td colspan="5" class="text-center text-danger">Error loading appointments.</td></tr>`;
  });
</script>

</body>
</html>
