<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>View Problem | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #e9eff5;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }

    .problem-card {
      max-width: 800px;
      margin: auto;
      padding: 35px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0px 7px 20px rgba(0,0,0,0.12);
      animation: fadeIn 0.4s ease-in-out;
    }

    h3 {
      font-weight: 700;
      color: #0d6efd;
      margin-bottom: 25px;
    }

    .details-box p {
      margin-bottom: 8px;
      font-size: 15px;
    }

    .problem-text {
      background: #f8fbff;
      border-left: 4px solid #0d6efd;
      padding: 18px 22px;
      border-radius: 12px;
      font-size: 16px;
      box-shadow: 0px 3px 10px rgba(0,0,0,0.05);
    }

    img {
      border-radius: 12px;
      border: 1px solid #ddd;
      max-width: 180px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="problem-card">

  <h3>
    <i class="bi bi-file-medical"></i> Problem Details
  </h3>

  <div id="content" class="details-box">Loading...</div>

</div>


<script>
const appointmentId = new URLSearchParams(window.location.search).get("appointmentId");

fetch(`/doctors/appointment/${appointmentId}`)
  .then(res => res.json())
  .then(appt => {

    let html = `
      <p><strong>Date:</strong> ${appt.date}</p>

      <p class="mt-2"><strong>Patient's Problem:</strong></p>
      <div class="problem-text">
        ${appt.problemDescription || "<em>No problem description provided.</em>"}
      </div>
    `;

    // Images section
    if (appt.images && appt.images.length) {
      html += `
        <p class="mt-4"><strong>Uploaded Images:</strong></p>
        <div class="d-flex flex-wrap gap-3">
      `;

      appt.images.forEach(img => {
        const src = "/" + img.replace(/\\/g, "/");
        html += `<img src="${src}" alt="Image">`;
      });

      html += `</div>`;
    }

    document.getElementById("content").innerHTML = html;

  })
  .catch(() => {
    document.getElementById("content").innerHTML =
      `<div class="text-danger">Error loading problem details.</div>`;
  });
</script>

</body>
</html>
