<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hospital Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f1f5f9;
      font-family: "Segoe UI", sans-serif;
    }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 250px;
      height: 100vh;
      background: #0d6efd;
      color: white;
      position: fixed;
      top: 0;
      left: 0;
      padding-top: 30px;
      box-shadow: 3px 0px 10px rgba(0,0,0,0.2);
    }

    .sidebar h3 {
      text-align: center;
      font-weight: 700;
      margin-bottom: 30px;
    }

    .sidebar a {
      color: #eaf1ff;
      text-decoration: none;
      padding: 12px 20px;
      display: block;
      font-size: 16px;
      border-radius: 8px;
      margin: 8px 12px;
    }

    .sidebar a:hover {
      background: #ffffff22;
    }

    /* --- MAIN CONTENT --- */
    .main {
      margin-left: 270px;
      padding: 30px;
    }

    .card {
      border-radius: 14px;
      padding: 25px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      transition: 0.25s;
      background: white;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.02);
    }

    .dash-title {
      font-weight: 700;
      margin-bottom: 25px;
    }

    .icon-box {
      font-size: 40px;
      color: #0d6efd;
    }

    .logout-btn {
      background: #dc3545 !important;
      color: white !important;
    }
  </style>

  <script>
    async function checkLogin() {
      const res = await fetch("/admin/check");
      const txt = await res.text();
      if (txt === "NOT_LOGGED_IN") {
        window.location.href = "/login.html";
      }
    }
    checkLogin();
  </script>
</head>

<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <h3>🏥 HMS Panel</h3>

    <a href="/dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
    <a href="/addPatient.html"><i class="bi bi-person-plus"></i> Add Patient</a>
    <a href="/viewPatients.html"><i class="bi bi-people"></i> View Patients</a>

    <a href="/addDoctor.html"><i class="bi bi-person-badge"></i> Add Doctor</a>
    <a href="/viewDoctors.html"><i class="bi bi-person-lines-fill"></i> View Doctors</a>

    <a href="/addAppointment.html"><i class="bi bi-calendar-plus"></i> Add Appointment</a>
    <a href="/viewAppointments.html"><i class="bi bi-calendar2-check"></i> View Appointments</a>

    <a href="/patientLogin.html"><i class="bi bi-door-open"></i> Patient Login</a>

    <a class="logout-btn mt-4" href="/admin/logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
  </div>


  <!-- MAIN CONTENT -->
  <div class="main">
    <h2 class="dash-title">Welcome to Hospital Management System</h2>

    <div class="row g-4">

      <!-- Add Patient -->
      <div class="col-md-4">
        <a href="/addPatient.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4>Add Patient</h4>
          </div>
        </a>
      </div>

      <!-- View Patients -->
      <div class="col-md-4">
        <a href="/viewPatients.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-people-fill"></i>
            </div>
            <h4>View Patients</h4>
          </div>
        </a>
      </div>

      <!-- Add Doctor -->
      <div class="col-md-4">
        <a href="/addDoctor.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-person-badge-fill"></i>
            </div>
            <h4>Add Doctor</h4>
          </div>
        </a>
      </div>

      <!-- View Doctors -->
      <div class="col-md-4">
        <a href="/viewDoctors.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-person-lines-fill"></i>
            </div>
            <h4>View Doctors</h4>
          </div>
        </a>
      </div>

      <!-- Add Appointment -->
      <div class="col-md-4">
        <a href="/addAppointment.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-calendar-plus-fill"></i>
            </div>
            <h4>Add Appointment</h4>
          </div>
        </a>
      </div>

      <!-- View Appointments -->
      <div class="col-md-4">
        <a href="/viewAppointments.html" style="text-decoration:none;">
          <div class="card text-center">
            <div class="icon-box mb-2">
              <i class="bi bi-calendar-check-fill"></i>
            </div>
            <h4>View Appointments</h4>
          </div>
        </a>
      </div>

      <!-- Patient Login -->
      <div class="col-md-4">
        <a href="/patientLogin.html" style="text-decoration:none;">
          <div class="card text-center" style="background:#fff3cd;">
            <div class="icon-box mb-2" style="color:#ff9800;">
              <i class="bi bi-door-open-fill"></i>
            </div>
            <h4>Patient Login</h4>
          </div>
        </a>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
