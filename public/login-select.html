<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Hospital Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
      max-width: 1200px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 50px;
    }

    .header h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .login-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      margin-top: 30px;
    }

    .login-card {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }

    .login-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.3);
    }

    .login-card .icon {
      font-size: 4rem;
      margin-bottom: 20px;
    }

    .login-card.admin .icon { color: #3b82f6; }
    .login-card.doctor .icon { color: #10b981; }
    .login-card.patient .icon { color: #8b5cf6; }

    .login-card h3 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .login-card p {
      color: #666;
      margin-bottom: 25px;
    }

    .login-card .btn {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      border-radius: 10px;
      font-weight: 600;
    }

    .login-card.admin .btn { background: #3b82f6; border: none; }
    .login-card.doctor .btn { background: #10b981; border: none; }
    .login-card.patient .btn { background: #8b5cf6; border: none; }

    @media (max-width: 768px) {
      .header h1 { font-size: 2rem; }
      .login-cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><i class="bi bi-hospital"></i> Hospital Management System</h1>
      <p>Select your login portal</p>
    </div>

    <div class="login-cards">
      <!-- Admin Login -->
      <div class="login-card admin" onclick="window.location.href='/login.html'">
        <div class="icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h3>Admin</h3>
        <p>System Administration & Management</p>
        <button class="btn btn-primary">Admin Login</button>
      </div>

      <!-- Doctor Login -->
      <div class="login-card doctor" onclick="window.location.href='/doctorLogin.html'">
        <div class="icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <h3>Doctor</h3>
        <p>Manage Appointments & Consultations</p>
        <button class="btn btn-success">Doctor Login</button>
      </div>

      <!-- Patient Login -->
      <div class="login-card patient" onclick="window.location.href='/patientLoginNew.html'">
        <div class="icon">
          <i class="bi bi-person-hearts"></i>
        </div>
        <h3>Patient</h3>
        <p>Book Appointments & View Records</p>
        <button class="btn btn-primary" style="background: #8b5cf6;">Patient Login</button>
      </div>
    </div>
  </div>

</body>
</html>
