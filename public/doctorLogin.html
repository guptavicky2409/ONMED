<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Login | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header .icon {
      font-size: 4rem;
      color: #10b981;
      margin-bottom: 15px;
    }

    .login-header h2 {
      font-weight: 700;
      color: #333;
    }

    .form-control {
      height: 50px;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #10b981, #059669);
      border: none;
      margin-top: 20px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
    }

    .signup-link {
      text-align: center;
      margin-top: 20px;
    }

    .signup-link a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }

    .back-link {
      text-align: center;
      margin-top: 15px;
    }

    .alert {
      border-radius: 10px;
    }

    .info-box {
      background: #d1fae5;
      border-left: 4px solid #10b981;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="icon">
        <i class="bi bi-heart-pulse-fill"></i>
      </div>
      <h2>Doctor Login</h2>
      <p class="text-muted">Access your consultation portal</p>
    </div>

    <div class="info-box">
      <small><i class="bi bi-info-circle-fill"></i> Your account must be verified by admin before login</small>
    </div>

    <div id="alertBox"></div>

    <div class="mb-3">
      <label class="form-label">Email Address</label>
      <input type="email" id="email" class="form-control" placeholder="Enter your registered email">
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter your password">
    </div>

    <button class="btn btn-success btn-login" onclick="handleLogin()">
      <i class="bi bi-box-arrow-in-right"></i> Login
    </button>

    <div class="signup-link">
      <p>New Doctor? <a href="/doctorSignup.html">Register Here</a></p>
    </div>

    <div class="back-link">
      <a href="/login-select.html" class="text-muted"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showAlert('Please fill in all fields');
        return;
      }

      try {
        const response = await fetch('/auth/doctor/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem('doctorId', data.doctor.id);
          localStorage.setItem('doctorName', data.doctor.name);
          showAlert('Login successful! Redirecting...', 'success');
          setTimeout(() => {
            window.location.href = '/doctorDashboardNew.html';
          }, 1000);
        } else {
          showAlert(data.error || 'Login failed');
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Network error. Please try again.');
      }
    }

    // Enter key to login
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
