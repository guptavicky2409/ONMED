<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Patient Login | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #42a5f5, #0d6efd);
      font-family: "Segoe UI", sans-serif;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 40px 35px;
      border-radius: 22px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
      width: 100%;
      max-width: 420px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .login-card h3 {
      font-weight: 700;
      color: #0d6efd;
      text-align: center;
      margin-bottom: 20px;
    }

    .icon-box {
      font-size: 55px;
      color: #0d6efd;
      text-align: center;
      margin-bottom: 15px;
    }

    .form-control {
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
    }

    .btn-primary {
      height: 50px;
      border-radius: 12px;
      font-size: 17px;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="login-card">

  <div class="icon-box">
    <i class="bi bi-person-heart"></i>
  </div>

  <h3>Patient Login</h3>

  <form id="patientLoginForm">
    <div class="mb-3">
      <input id="patientId" class="form-control" placeholder="Enter Patient ID" required>
    </div>

    <button class="btn btn-primary w-100">Login</button>
  </form>
</div>

<script>
document.getElementById("patientLoginForm").onsubmit = (e) => {
  e.preventDefault();

  const pid = document.getElementById("patientId").value.trim();
  if (!pid) return alert("Please enter Patient ID");

  localStorage.setItem("patientId", pid);
  window.location.href = "/patientDashboard.html";
};
</script>

</body>
</html>
