<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Patient | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #f1f5f9;
      font-family: "Segoe UI", sans-serif;
    }

    .form-card {
      max-width: 600px;
      margin: auto;
      margin-top: 60px;
      padding: 35px;
      background: white;
      border-radius: 18px;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.10);
      animation: fadeIn 0.4s ease-in-out;
    }

    h2 {
      font-weight: 700;
    }

    .form-control {
      height: 48px;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn {
      height: 45px;
      font-size: 16px;
      border-radius: 10px;
    }

    .back-link {
      text-decoration: none;
      font-size: 15px;
      display: inline-block;
      margin-top: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="form-card">
    <h2 class="text-center mb-4"><i class="bi bi-person-plus-fill text-primary"></i> Add New Patient</h2>

    <form action="/patients/add" method="POST">

      <!-- Name -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Patient Name</label>
        <input name="name" class="form-control" placeholder="Enter full name" required>
      </div>

      <!-- Age -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Age</label>
        <input name="age" type="number" class="form-control" placeholder="Enter age">
      </div>

      <!-- Gender -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Gender</label>
        <select name="gender" class="form-control">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <!-- Disease -->
      <div class="mb-3">
        <label class="form-label fw-semibold">Disease / Reason</label>
        <input name="disease" class="form-control" placeholder="Enter disease or reason">
      </div>

      <button class="btn btn-primary w-100 mt-2" type="submit">
        <i class="bi bi-check2-circle"></i> Add Patient
      </button>

      <a href="/viewPatients.html" class="back-link text-primary">
        <i class="bi bi-arrow-left-circle"></i> View Patients
      </a>

    </form>
  </div>

</body>
</html>
