<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Admin | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0d6efd, #3a7bd5);
      font-family: "Segoe UI", sans-serif;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      padding: 40px 35px;
      border-radius: 22px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0px 8px 25px rgba(0,0,0,0.25);
      animation: fadeIn 0.5s ease-in-out;
    }

    h3 {
      text-align: center;
      color: #0d6efd;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .icon-box {
      font-size: 55px;
      color: #0d6efd;
      text-align: center;
      margin-bottom: 15px;
    }

    .form-control {
      height: 50px;
      border-radius: 12px;
      font-size: 16px;
    }

    .btn-primary {
      height: 50px;
      font-size: 17px;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(0, 86, 179, 0.4);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="form-card">

  <div class="icon-box">
    <i class="bi bi-person-badge-fill"></i>
  </div>

  <h3>Create Admin</h3>

  <form action="/admin/register" method="POST">

    <div class="mb-3">
      <input name="username" class="form-control" placeholder="New Username" required>
    </div>

    <div class="mb-3">
      <input type="password" name="password" class="form-control" placeholder="Password" required>
    </div>

    <button class="btn btn-primary w-100">Create Admin</button>
  </form>

</div>

</body>
</html>
