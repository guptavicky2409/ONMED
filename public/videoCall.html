<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .videos-wrapper {
      display: flex;
      gap: 20px;
      width: 100%;
      max-width: 1400px;
      height: calc(100vh - 150px);
    }

    .video-box {
      position: relative;
      flex: 1;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .video-label {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      z-index: 10;
    }

    .waiting-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      z-index: 5;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 50px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      z-index: 100;
    }

    .control-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.3s;
      background: #4a5568;
      color: white;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .control-btn.off {
      background: #fc8181;
    }

    .btn-end {
      background: #e53e3e !important;
    }

    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 100;
    }

    .connection-status {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 12px;
      z-index: 100;
      max-width: 300px;
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }

    .status-dot.connecting {
      background: #fbbf24;
      animation: pulse 1.5s infinite;
    }

    .status-dot.connected {
      background: #10b981;
    }

    .status-dot.failed {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="status" id="status">
    <span class="status-dot connecting" id="statusDot"></span>
    <span id="statusText">Connecting...</span>
  </div>

  <div class="connection-status" id="connectionStatus">
    <div><strong>Connection:</strong> <span id="connState">new</span></div>
    <div><strong>ICE:</strong> <span id="iceState">new</span></div>
    <div><strong>Signal:</strong> <span id="sigState">stable</span></div>
  </div>

  <div class="video-container">
    <div class="videos-wrapper">
      <!-- Local Video -->
      <div class="video-box">
        <div class="video-label">You</div>
        <video id="localVideo" autoplay playsinline muted></video>
      </div>

      <!-- Remote Video -->
      <div class="video-box">
        <div class="video-label">Remote User</div>
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="waiting-message" id="waiting">
          <div class="spinner"></div>
          <p>Waiting for the other person to join...</p>
        </div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn" id="micBtn" title="Toggle Microphone">
      <i class="bi bi-mic-fill"></i>
    </button>
    <button class="control-btn" id="videoBtn" title="Toggle Video">
      <i class="bi bi-camera-video-fill"></i>
    </button>
    <button class="control-btn btn-end" id="endBtn" title="End Call">
      <i class="bi bi-telephone-x-fill"></i>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomId = window.location.pathname.split("/").pop();

    let localStream;
    let remoteStream;
    let peerConnection;
    let audioEnabled = true;
    let videoEnabled = true;
    let isOfferer = false;
    let iceCandidatesQueue = [];

    // ICE servers configuration with both STUN and TURN
    const configuration = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'stun:stun2.l.google.com:19302' },
        {
          urls: 'turn:openrelay.metered.ca:80',
          username: 'openrelayproject',
          credential: 'openrelayproject',
        },
        {
          urls: 'turn:openrelay.metered.ca:443',
          username: 'openrelayproject',
          credential: 'openrelayproject',
        }
      ],
      iceCandidatePoolSize: 10
    };

    // Update status
    function updateStatus(text, connected = false, failed = false) {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot ' + (failed ? 'failed' : connected ? 'connected' : 'connecting');
    }

    // Initialize media and peer connection
    async function initializeCall() {
      try {
        console.log('🎥 Requesting media devices...');
        updateStatus('Accessing camera and microphone...');

        // Get user media
        localStream = await navigator.mediaDevices.getUserMedia({
          video: {
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: true
        });

        console.log('✅ Got local stream:', {
          video: localStream.getVideoTracks().length,
          audio: localStream.getAudioTracks().length
        });

        // Display local video
        document.getElementById('localVideo').srcObject = localStream;

        // Create peer connection
        createPeerConnection();

        // Join room
        socket.emit('join-room', roomId);
        updateStatus('Joined room, waiting for other participant...');
        console.log('✅ Sent join-room for room:', roomId);

      } catch (error) {
        console.error('❌ Error accessing media devices:', error);
        updateStatus('Failed to access camera/microphone', false, true);
        alert('Could not access camera/microphone. Please check permissions and try again.');
      }
    }

    // Create peer connection
    function createPeerConnection() {
      console.log('🔗 Creating peer connection...');
      peerConnection = new RTCPeerConnection(configuration);

      // Add local stream tracks
      localStream.getTracks().forEach(track => {
        console.log('📤 Adding local track:', track.kind);
        peerConnection.addTrack(track, localStream);
      });

      // Setup remote stream
      remoteStream = new MediaStream();
      document.getElementById('remoteVideo').srcObject = remoteStream;

      // Handle incoming tracks
      peerConnection.ontrack = (event) => {
        console.log('📥 Received remote track:', event.track.kind);
        event.streams[0].getTracks().forEach(track => {
          console.log('➕ Adding track to remote stream:', track.kind);
          remoteStream.addTrack(track);
        });
        
        // Hide waiting message
        document.getElementById('waiting').style.display = 'none';
        updateStatus('Connected', true);
      };

      // Handle ICE candidates
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          console.log('🧊 Sending ICE candidate');
          socket.emit('ice-candidate', {
            roomId: roomId,
            candidate: event.candidate
          });
        } else {
          console.log('✅ All ICE candidates sent');
        }
      };

      // Connection state changes
      peerConnection.onconnectionstatechange = () => {
        const state = peerConnection.connectionState;
        console.log('🔄 Connection state:', state);
        document.getElementById('connState').textContent = state;

        if (state === 'connected') {
          updateStatus('Connected', true);
        } else if (state === 'failed' || state === 'disconnected') {
          updateStatus('Connection ' + state, false, true);
        } else if (state === 'connecting') {
          updateStatus('Connecting...');
        }
      };

      // ICE connection state
      peerConnection.oniceconnectionstatechange = () => {
        const state = peerConnection.iceConnectionState;
        console.log('🧊 ICE connection state:', state);
        document.getElementById('iceState').textContent = state;
      };

      // Signaling state
      peerConnection.onsignalingstatechange = () => {
        const state = peerConnection.signalingState;
        console.log('📡 Signaling state:', state);
        document.getElementById('sigState').textContent = state;
      };

      // ICE gathering state
      peerConnection.onicegatheringstatechange = () => {
        console.log('🧊 ICE gathering state:', peerConnection.iceGatheringState);
      };
    }

    // Create and send offer
    async function createOffer() {
      try {
        console.log('📞 Creating offer...');
        isOfferer = true;
        
        const offer = await peerConnection.createOffer({
          offerToReceiveAudio: true,
          offerToReceiveVideo: true
        });
        
        await peerConnection.setLocalDescription(offer);
        console.log('✅ Local description set (offer)');
        
        socket.emit('offer', {
          roomId: roomId,
          offer: offer
        });
        
        updateStatus('Calling...');
      } catch (error) {
        console.error('❌ Error creating offer:', error);
        updateStatus('Failed to create call', false, true);
      }
    }

    // Handle incoming offer
    async function handleOffer(offer) {
      try {
        console.log('📥 Received offer, creating answer...');
        isOfferer = false;
        
        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        console.log('✅ Remote description set (offer)');
        
        // Process queued ICE candidates
        while (iceCandidatesQueue.length > 0) {
          const candidate = iceCandidatesQueue.shift();
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          console.log('✅ Added queued ICE candidate');
        }
        
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        console.log('✅ Local description set (answer)');
        
        socket.emit('answer', {
          roomId: roomId,
          answer: answer
        });
        
        updateStatus('Connecting...');
      } catch (error) {
        console.error('❌ Error handling offer:', error);
        updateStatus('Failed to answer call', false, true);
      }
    }

    // Handle incoming answer
    async function handleAnswer(answer) {
      try {
        console.log('📥 Received answer');
        
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        console.log('✅ Remote description set (answer)');
        
        // Process queued ICE candidates
        while (iceCandidatesQueue.length > 0) {
          const candidate = iceCandidatesQueue.shift();
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
          console.log('✅ Added queued ICE candidate');
        }
        
        updateStatus('Connecting...');
      } catch (error) {
        console.error('❌ Error handling answer:', error);
      }
    }

    // Handle incoming ICE candidate
    async function handleIceCandidate(candidate) {
      try {
        if (!peerConnection.remoteDescription) {
          console.log('⏳ Queuing ICE candidate (no remote description yet)');
          iceCandidatesQueue.push(candidate);
          return;
        }
        
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        console.log('✅ Added ICE candidate');
      } catch (error) {
        console.error('❌ Error adding ICE candidate:', error);
      }
    }

    // Socket event handlers
    socket.on('user-joined', (data) => {
      console.log('👤 User joined:', data.socketId);
      updateStatus('User joined, preparing call...');
    });

    socket.on('start-call', (data) => {
      console.log('🚀 Starting call with role:', data.role);
      if (data.role === 'offerer') {
        isOfferer = true;
        createOffer();
      } else {
        console.log('Waiting for offer as answerer');
        isOfferer = false;
      }
    });

    socket.on('offer', (offer) => {
      console.log('📨 Received offer');
      handleOffer(offer);
    });

    socket.on('answer', (answer) => {
      console.log('📨 Received answer');
      handleAnswer(answer);
    });

    socket.on('ice-candidate', (candidate) => {
      console.log('📨 Received ICE candidate');
      handleIceCandidate(candidate);
    });

    socket.on('user-disconnected', (userId) => {
      console.log('👋 User disconnected:', userId);
      updateStatus('Other user left the call', false, true);
      alert('The other participant has left the call.');
    });

    // Control buttons
    document.getElementById('micBtn').onclick = () => {
      audioEnabled = !audioEnabled;
      localStream.getAudioTracks()[0].enabled = audioEnabled;
      
      const btn = document.getElementById('micBtn');
      btn.classList.toggle('off', !audioEnabled);
      btn.innerHTML = audioEnabled ? 
        '<i class="bi bi-mic-fill"></i>' : 
        '<i class="bi bi-mic-mute-fill"></i>';
    };

    document.getElementById('videoBtn').onclick = () => {
      videoEnabled = !videoEnabled;
      localStream.getVideoTracks()[0].enabled = videoEnabled;
      
      const btn = document.getElementById('videoBtn');
      btn.classList.toggle('off', !videoEnabled);
      btn.innerHTML = videoEnabled ? 
        '<i class="bi bi-camera-video-fill"></i>' : 
        '<i class="bi bi-camera-video-off-fill"></i>';
    };

    document.getElementById('endBtn').onclick = () => {
      if (confirm('Are you sure you want to end the call?')) {
        // Stop all tracks
        if (localStream) {
          localStream.getTracks().forEach(track => track.stop());
        }
        
        // Close peer connection
        if (peerConnection) {
          peerConnection.close();
        }
        
        // Disconnect socket
        socket.disconnect();
        
        // Close window
        window.close();
      }
    };

    // Start the call when page loads
    window.onload = () => {
      console.log('🏁 Initializing call for room:', roomId);
      initializeCall();
    };

    // Cleanup on page unload
    window.onbeforeunload = () => {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (peerConnection) {
        peerConnection.close();
      }
      socket.disconnect();
    };
  </script>

</body>
</html>
