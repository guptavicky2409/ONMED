<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Call | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      padding: 20px;
    }

    .video-wrapper {
      position: relative;
      flex: 1;
      max-width: 45%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    video {
      width: 100%;
      height: auto;
      display: block;
      background: #000;
      border-radius: 20px;
    }

    .video-label {
      position: absolute;
      top: 15px;
      left: 15px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 15px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      padding: 15px 25px;
      border-radius: 50px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
    }

    .control-btn {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.3s;
    }

    .control-btn:hover {
      transform: scale(1.1);
    }

    .btn-mic, .btn-video {
      background: #4a5568;
      color: white;
    }

    .btn-end {
      background: #e53e3e;
      color: white;
    }

    .btn-mic.off, .btn-video.off {
      background: #fc8181;
    }

    .status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
    }

    .waiting {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="status" id="status">Connecting...</div>

  <div class="video-container">
    <div class="video-wrapper">
      <div class="video-label">You</div>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>

    <div class="video-wrapper">
      <div class="video-label">Remote User</div>
      <video id="remoteVideo" autoplay playsinline></video>
      <div class="waiting" id="waiting">
        <div class="spinner"></div>
        <p>Waiting for the other person to join...</p>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="control-btn btn-mic" id="micBtn" title="Toggle Microphone">
      <i class="bi bi-mic-fill"></i>
    </button>
    <button class="control-btn btn-video" id="videoBtn" title="Toggle Video">
      <i class="bi bi-camera-video-fill"></i>
    </button>
    <button class="control-btn btn-end" id="endBtn" title="End Call">
      <i class="bi bi-telephone-x-fill"></i>
    </button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const roomId = window.location.pathname.split("/").pop();

    let localStream;
    let remoteStream;
    let peerConnection;
    let audioEnabled = true;
    let videoEnabled = true;

    const servers = { 
      iceServers: [
        { urls: "stun:stun.l.google.com:19302" },
        { urls: "stun:stun1.l.google.com:19302" }
      ] 
    };

    // Start call
    async function startCall() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ 
          video: true, 
          audio: true 
        });

        document.getElementById("localVideo").srcObject = localStream;
        document.getElementById("status").textContent = "Connected";

        peerConnection = new RTCPeerConnection(servers);

        remoteStream = new MediaStream();
        document.getElementById("remoteVideo").srcObject = remoteStream;

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        peerConnection.ontrack = (event) => {
          event.streams[0].getTracks().forEach(track => {
            remoteStream.addTrack(track);
          });
          document.getElementById("waiting").style.display = "none";
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit("ice-candidate", { roomId, candidate: event.candidate });
          }
        };

        peerConnection.onconnectionstatechange = () => {
          console.log("Connection state:", peerConnection.connectionState);
          document.getElementById("status").textContent = 
            peerConnection.connectionState.charAt(0).toUpperCase() + 
            peerConnection.connectionState.slice(1);
        };

      } catch (err) {
        console.error("Error accessing media devices:", err);
        alert("Unable to access camera/microphone. Please check permissions.");
      }
    }

    // Socket events
    socket.emit("join-room", roomId);

    socket.on("user-connected", async (userId) => {
      console.log("User connected:", userId);
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit("offer", { roomId, offer });
    });

    socket.on("offer", async (offer) => {
      await peerConnection.setRemoteDescription(offer);
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit("answer", { roomId, answer });
    });

    socket.on("answer", async (answer) => {
      await peerConnection.setRemoteDescription(answer);
    });

    socket.on("ice-candidate", async (candidate) => {
      try { 
        await peerConnection.addIceCandidate(candidate); 
      } catch (e) { 
        console.error("Error adding ICE candidate:", e); 
      }
    });

    // Controls
    document.getElementById("micBtn").onclick = () => {
      audioEnabled = !audioEnabled;
      localStream.getAudioTracks()[0].enabled = audioEnabled;
      
      const btn = document.getElementById("micBtn");
      if (audioEnabled) {
        btn.classList.remove("off");
        btn.innerHTML = '<i class="bi bi-mic-fill"></i>';
      } else {
        btn.classList.add("off");
        btn.innerHTML = '<i class="bi bi-mic-mute-fill"></i>';
      }
    };

    document.getElementById("videoBtn").onclick = () => {
      videoEnabled = !videoEnabled;
      localStream.getVideoTracks()[0].enabled = videoEnabled;
      
      const btn = document.getElementById("videoBtn");
      if (videoEnabled) {
        btn.classList.remove("off");
        btn.innerHTML = '<i class="bi bi-camera-video-fill"></i>';
      } else {
        btn.classList.add("off");
        btn.innerHTML = '<i class="bi bi-camera-video-off-fill"></i>';
      }
    };

    document.getElementById("endBtn").onclick = () => {
      if (confirm("Are you sure you want to end the call?")) {
        localStream.getTracks().forEach(track => track.stop());
        if (peerConnection) peerConnection.close();
        window.close();
      }
    };

    // Start when page loads
    startCall();
  </script>

</body>
</html>
