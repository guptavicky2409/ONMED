<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>View Prescription | HMS</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #e9eff5;
            font-family: "Segoe UI", sans-serif;
            padding: 40px;
        }

        .card-box {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0px 7px 20px rgba(0,0,0,0.12);
            animation: fadeIn .4s ease-in-out;
        }

        h2 {
            color: #0d6efd;
            font-weight: 700;
        }

        .info-section p {
            margin-bottom: 8px;
            font-size: 15px;
        }

        .prescription-box {
            background: #f8fbff;
            border-left: 4px solid #0d6efd;
            padding: 18px 22px;
            border-radius: 12px;
            font-size: 16px;
            box-shadow: 0px 3px 10px rgba(0,0,0,0.05);
        }

        img {
            border-radius: 12px;
            border: 1px solid #ddd;
            max-width: 180px;
        }

        .btn {
            height: 48px;
            border-radius: 12px;
            font-size: 16px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

<div class="card-box">

    <h2 class="mb-4">
        <i class="bi bi-file-medical-fill"></i> Prescription Details
    </h2>

    <div id="info" class="info-section mb-4">Loading...</div>

    <hr class="my-4">

    <!-- Action Buttons -->
    <div class="d-flex flex-wrap gap-3">
        <button id="downloadReceipt" class="btn btn-outline-primary flex-grow-1">
            <i class="bi bi-filetype-pdf"></i> Download Prescription (PDF)
        </button>

        <button id="videoBtn" class="btn btn-dark flex-grow-1">
            <i class="bi bi-camera-video-fill"></i> Join Video Call
        </button>
    </div>

</div>


<script>
const appointmentId = new URLSearchParams(window.location.search).get("appointmentId");

// Load appointment & prescription data
fetch(`/doctors/appointment/${appointmentId}`)
    .then(response => response.json())
    .then(appt => {
        let html = `
            <p><strong>Doctor:</strong> ${appt.doctorName || appt.doctorId}</p>
            <p><strong>Date:</strong> ${appt.date}</p>

            <p class="mt-3"><strong>Prescription:</strong></p>
            <div class="prescription-box">
                ${appt.prescription || "<em>No prescription provided yet.</em>"}
            </div>
        `;

        // Images if present
        if (appt.images && appt.images.length) {
            html += `<p class="mt-4"><strong>Uploaded Images:</strong></p>
                     <div class="d-flex flex-wrap gap-3">`;

            appt.images.forEach(img => {
                const src = "/" + img.replace(/\\/g, "/");
                html += `<img src="${src}" alt="Image">`;
            });

            html += `</div>`;
        }

        document.getElementById("info").innerHTML = html;
    })
    .catch(() => {
        document.getElementById("info").innerHTML =
            `<div class="text-danger">Error loading prescription.</div>`;
    });

// Download PDF
document.getElementById("downloadReceipt").onclick = () => {
    window.open(`/doctors/receipt/${appointmentId}`, "_blank");
};

// Video Call Button
document.getElementById("videoBtn").onclick = () => {
    alert("Video call feature coming soon!");
};
</script>

</body>
</html>
