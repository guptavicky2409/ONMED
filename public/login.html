<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 450px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-header .icon {
      font-size: 4rem;
      color: #3b82f6;
      margin-bottom: 15px;
    }

    .login-header h2 {
      font-weight: 700;
      color: #333;
    }

    .form-control {
      height: 50px;
      border-radius: 10px;
      font-size: 16px;
    }

    .btn-login {
      width: 100%;
      height: 50px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #3b82f6, #1e40af);
      border: none;
      margin-top: 20px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
    }

    .back-link {
      text-align: center;
      margin-top: 15px;
    }

    .alert {
      border-radius: 10px;
    }

    .info-box {
      background: #dbeafe;
      border-left: 4px solid #3b82f6;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div class="icon">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h2>Admin Login</h2>
      <p class="text-muted">System Administration Portal</p>
    </div>

    <div class="info-box">
      <small><i class="bi bi-info-circle-fill"></i> Default login: admin / admin123</small>
    </div>

    <div id="alertBox"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn btn-primary btn-login">
        <i class="bi bi-box-arrow-in-right"></i> Login
      </button>
    </form>

    <div class="back-link">
      <a href="/login-select.html" class="text-muted"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>
  </div>

  <script>
    function showAlert(message, type = 'danger') {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          ${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      if (!username || !password) {
        showAlert('Please fill in all fields');
        return;
      }

      try {
        const response = await fetch('/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
          },
          body: new URLSearchParams({
            username: username,
            password: password
          })
        });

        if (response.redirected) {
          // Login successful, redirected to dashboard
          window.location.href = response.url;
        } else {
          // Login failed, get error message
          const errorMessage = await response.text();
          showAlert(errorMessage);
        }
      } catch (err) {
        console.error('Login error:', err);
        showAlert('Network error. Please try again.');
      }
    });

    // Enter key to login
    document.getElementById('password').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
