<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>View Doctors | HMS</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #e9eff5;
      font-family: "Segoe UI", sans-serif;
      padding: 40px;
    }

    .page-box {
      max-width: 900px;
      margin: auto;
      background: #ffffff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0px 7px 20px rgba(0,0,0,0.12);
      animation: fadeIn .4s ease-in-out;
    }

    h2 {
      font-weight: 700;
      color: #0d6efd;
    }

    table {
      border-radius: 12px;
      overflow: hidden;
    }

    thead {
      background: #0d6efd;
      color: white;
    }

    tr:hover {
      background: #f2f8ff;
    }

    .btn-sm {
      border-radius: 8px;
      font-size: 14px;
      padding: 6px 12px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="page-box">

  <!-- Page Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-person-lines-fill"></i> Doctors</h2>

    <a href="/addDoctor.html" class="btn btn-success">
      <i class="bi bi-plus-circle"></i> Add New Doctor
    </a>
  </div>

  <!-- Table -->
  <table class="table table-hover table-bordered shadow-sm" id="doctorTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Specialization</th>
        <th style="width: 150px;">Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
// Load All Doctors
async function loadDoctors() {
  const res = await fetch('/doctors');
  const data = await res.json();

  const tbody = document.querySelector('#doctorTable tbody');
  tbody.innerHTML = '';

  data.forEach(d => {
    const tr = document.createElement('tr');

    tr.innerHTML = `
      <td>${d.name}</td>
      <td>${d.specialization}</td>
      <td>
        <button class="btn btn-danger btn-sm" onclick="deleteDoctor('${d._id}')">
          <i class="bi bi-trash-fill"></i> Delete
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

// Delete Doctor
async function deleteDoctor(id) {
  if (!confirm("Are you sure you want to delete this doctor?")) return;

  await fetch('/doctors/' + id, { method: 'DELETE' });
  loadDoctors();
}

window.onload = loadDoctors;
</script>

</body>
</html>
